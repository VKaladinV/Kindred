# Kindred is plain static files — the folder is published as-is. The one
# command stamps the deploy into version.json, which is how an already
# installed app tells that the site has moved on without it.

[build]
  publish = "."
  command = "node tools/stamp.js"

# The service worker and the page itself must never be served stale from the
# CDN, or an update to the app would not reach a device that already has it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Rewritten on every deploy. Served from cache it would tell an app it is up
# to date at exactly the moment it stopped being true.
[[headers]]
  for = "/version.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

# Verifies the Android app against this domain so the wrapped APK opens without
# a browser URL bar. The file is added at the point the APK is built.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
